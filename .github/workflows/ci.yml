name: BFR CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore BatchFileRenamer.sln

      - name: Build Solution (Release)
        run: dotnet build BatchFileRenamer.sln -c Release --no-restore

      - name: Run Unit Tests & QA Matrix
        run: dotnet test tests/BFR.Core.Tests/BFR.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run ViewModel Tests (UI layer, không phụ thuộc WPF)
        run: dotnet test tests/BFR.Presentation.Tests/BFR.Presentation.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run Property-Based Tests (FsCheck 1000 runs)
        run: dotnet test tests/BFR.Core.PropertyTests/BFR.Core.PropertyTests.csproj -c Release --no-build --verbosity normal

      - name: Performance Gate (NFR-1..NFR-5)
        shell: powershell
        run: |
          dotnet run --project tests/BFR.PerfGate/BFR.PerfGate.csproj -c Release --no-build -- artifacts/perf-report.md
          if ($LASTEXITCODE -ne 0) { throw "Vượt ngưỡng hiệu năng (xem artifacts/perf-report.md)." }

      - name: Benchmarks (BenchmarkDotNet — theo dõi hồi quy)
        shell: powershell
        continue-on-error: true
        run: |
          dotnet run --project tests/BFR.Benchmarks/BFR.Benchmarks.csproj -c Release --no-build -- --filter "*" --job short --exporters json
          if (Test-Path "BenchmarkDotNet.Artifacts") {
            Copy-Item "BenchmarkDotNet.Artifacts\results\*.json" "artifacts\" -ErrorAction SilentlyContinue
            Copy-Item "BenchmarkDotNet.Artifacts\results\*.md" "artifacts\" -ErrorAction SilentlyContinue
          }

      - name: Build MSIX Layout & Portable ZIP Package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/msix/build-msix.ps1 -Configuration Release

      - name: COM Local Server Smoke Test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $layout = (Resolve-Path "artifacts/msix-layout").Path
          try {
            & "$layout/bfr.exe" context-menu register --path "$layout/BatchFileRenamer.exe"
            if ($LASTEXITCODE -ne 0) { throw "Đăng ký COM thất bại." }
            dotnet run --project tests/BFR.Shell.SmokeTest/BFR.Shell.SmokeTest.csproj -c Release --no-build
            if ($LASTEXITCODE -ne 0) { throw "COM smoke test thất bại." }
          } finally {
            & "$layout/bfr.exe" context-menu unregister
            Get-Process BFR.Shell -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: UI Smoke Test (Add to Preview to Apply to Undo + Pro dialog + Regex + Palette)
        shell: powershell
        continue-on-error: true
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/smoke-ui.ps1 | Tee-Object -FilePath artifacts/smoke-ui.log

      - name: Capture UI Screenshots (Upgrade states + Regex tester)
        shell: powershell
        continue-on-error: true
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/capture-upgrade-states.ps1 | Tee-Object -FilePath artifacts/capture.log

      - name: CLI License & Context Menu Smoke Test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $layout = (Resolve-Path "artifacts/msix-layout").Path
          & "$layout/bfr.exe" license status
          if ($LASTEXITCODE -ne 0) { throw "bfr license status thất bại." }
          & "$layout/bfr.exe" context-menu status
          if ($LASTEXITCODE -ne 0) { throw "bfr context-menu status thất bại." }

      - name: Upload Packaging Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-file-renamer-artifacts
          path: |
            artifacts/*.zip
            artifacts/*.msix
            artifacts/perf-report.md
            artifacts/*.log
            artifacts/*.json
            artifacts/*.md
            artifacts/msix-layout/
            docs/ui-upgrade/
          retention-days: 14
